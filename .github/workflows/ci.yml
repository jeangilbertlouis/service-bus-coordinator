name: CI

# Builds and tests on every push/PR, packages the app for each OS, and publishes a GitHub release for v* tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ServiceBusCoordinator.sln -c Release

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ServiceBusCoordinator.App/ServiceBusCoordinator.App.csproj | head -n 1)
            echo "value=${base}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/publish.ps1 -Runtime ${{ matrix.rid }} -Version ${{ steps.version.outputs.value }}

      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: bash build/publish.sh ${{ matrix.rid }} ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: ServiceBusCoordinator-${{ matrix.rid }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The app's in-place updater refuses packages that do not match this file.
      - name: Checksums
        working-directory: dist
        run: sha256sum ServiceBusCoordinator-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
