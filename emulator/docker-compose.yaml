# Local Azure Service Bus emulator for development and integration tests.
# Usage (from this folder):  copy .env.example to .env, set MSSQL_SA_PASSWORD, then `docker compose up -d`.
# Data plane connection string:
#   Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
name: sbc-servicebus-emulator
services:
  emulator:
    container_name: "sbc-servicebus-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    pull_policy: always
    volumes:
      - "./Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: "${ACCEPT_EULA}"
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 20
    depends_on:
      - mssql
    networks:
      sb-emulator:
        aliases:
          - "sb-emulator"
  mssql:
    container_name: "sbc-servicebus-emulator-mssql"
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    networks:
      sb-emulator:
        aliases:
          - "mssql"

networks:
  sb-emulator:
